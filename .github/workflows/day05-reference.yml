name: ISO8583 Day 5 reference validation
on:
  push:
    branches: [feature/iso8583-day05-reference]
    paths: ['ci/day05/**', '.github/workflows/day05-reference.yml']
  pull_request:
    branches: [ci/day04-validation]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake g++ libboost-dev libsqlite3-dev
      - name: Extract canonical Day 4 and apply Day 5 changes
        run: |
          mkdir -p /tmp/day05
          unzip -q ci/day04/ISO8583_Day04_Complete_Course_Pack.zip -d /tmp/day05
          P=/tmp/day05/ISO8583_Day04_Course_Pack/instructor/reference
          python3 ci/day05/apply_policy.py "$P"
          cmake -S "$P" -B /tmp/day05/build -DCMAKE_BUILD_TYPE=Debug
          cmake --build /tmp/day05/build -j 2
          ctest --test-dir /tmp/day05/build --output-on-failure
          python3 ci/day05/test_policy.py /tmp/day05/build/gateway "$P/schema.sql"
          python3 ci/day05/test_edges.py /tmp/day05/build/gateway "$P/schema.sql"
          python3 ci/day05/test_timeout.py /tmp/day05/build/gateway "$P/schema.sql"
          python3 ci/day05/test_regression.py /tmp/day05/build/gateway "$P/schema.sql"
          python3 ci/day05/test_failures.py /tmp/day05/build/gateway "$P/schema.sql"
      - name: Run existing Day 5 public and reserved grader
        run: |
          git fetch --no-tags origin ci-iso8583-gateway-20261119
          git show FETCH_HEAD:ci/day05-grader-ci.zip > /tmp/day05-grader-ci.zip
          unzip -q /tmp/day05-grader-ci.zip
          P=/tmp/day05/ISO8583_Day04_Course_Pack/instructor/reference
          cp "$P/include/iso8583_parser.hpp" day05_grader/reference/include/
          cp "$P/src/iso8583_parser.cpp" day05_grader/reference/src/
          cp "$P/include/database.hpp" day05_grader/reference/include/
          cp "$P/src/database.cpp" day05_grader/reference/src/
          cmake -S day05_grader/reference -B /tmp/day05/unit-build -DCMAKE_BUILD_TYPE=Debug
          cmake --build /tmp/day05/unit-build -j 2
          ctest --test-dir /tmp/day05/unit-build -R '^(parser_complete|composer_complete|sqlite_)' --output-on-failure
          python3 day05_grader/grade.py --gateway /tmp/day05/build/gateway --report /tmp/day05-grade.json || { cat /tmp/day05-grade.json; exit 1; }
      - name: Stress and fuzz after grader
        run: python3 ci/day05/test_stress.py /tmp/day05/build/gateway /tmp/day05/ISO8583_Day04_Course_Pack/instructor/reference/schema.sql
      - name: Validate Week 11 Day 1 exercise against canonical
        run: |
          git fetch --no-tags origin exercise/week11-day01 canonical/iso8583-gateway-complete
          mkdir -p /tmp/week11-exercise /tmp/week11-canonical
          git archive origin/exercise/week11-day01 iso8583/canonical-gateway week11/day01/test_acceptance.py | tar -x -C /tmp/week11-exercise
          git archive origin/canonical/iso8583-gateway-complete iso8583/canonical-gateway | tar -x -C /tmp/week11-canonical
          E=/tmp/week11-exercise/iso8583/canonical-gateway
          C=/tmp/week11-canonical/iso8583/canonical-gateway
          cmake -S "$E" -B /tmp/week11-exercise-build -DCMAKE_BUILD_TYPE=Debug
          cmake --build /tmp/week11-exercise-build -j2
          python3 /tmp/week11-exercise/week11/day01/test_acceptance.py /tmp/week11-exercise-build/gateway "$E/schema.sql" --scenario normal
          if python3 /tmp/week11-exercise/week11/day01/test_acceptance.py /tmp/week11-exercise-build/gateway "$E/schema.sql" --scenario local; then
            echo "ERROR: exercise did not expose intended observable malfunction"; exit 1
          fi
          echo "PASS: controlled exercise reproduces incorrect SQLite outcome"
          cmake -S "$C" -B /tmp/week11-canonical-build -DCMAKE_BUILD_TYPE=Debug
          cmake --build /tmp/week11-canonical-build -j2
          python3 /tmp/week11-exercise/week11/day01/test_acceptance.py /tmp/week11-canonical-build/gateway "$C/schema.sql" --scenario local
      - name: Package validated source
        if: success()
        run: |
          cd /tmp/day05/ISO8583_Day04_Course_Pack/instructor
          mv reference day05_reference
          zip -qr "$GITHUB_WORKSPACE/ISO8583_Week10_Day05_Reference.zip" day05_reference
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ISO8583_Week10_Day05_Reference
          path: ISO8583_Week10_Day05_Reference.zip
