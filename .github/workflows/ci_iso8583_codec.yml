name: ISO8583 Codec Regression
on:
  push:
    branches: [ci-iso8583-codec-20261119]
  workflow_dispatch:
jobs:
  codec:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        env:
          CXX: ${{ matrix.compiler }}
        run: cmake -S ci/iso8583 -B build-iso8583 -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
      - name: Compile
        run: cmake --build build-iso8583 --parallel 2
      - name: Run regression suite
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --test-dir build-iso8583 --output-on-failure
