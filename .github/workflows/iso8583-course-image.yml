name: ISO8583 course container
on:
  push:
    branches: [iso8583-course-devcontainer]
    paths:
      - 'iso8583-course/**'
      - '.github/workflows/iso8583-course-image.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build local test image
        run: docker build -t iso8583-course:test ./iso8583-course
      - name: Verify installed tools and linked libraries
        run: |
          bash iso8583-course/smoke-test.sh iso8583-course:test --local
  publish:
    needs: smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./iso8583-course
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/iso8583-course:latest
