name: ISO8583 mock gateway verification
on:
  push:
    branches: [ci-iso8583-gateway-20261119]
  workflow_dispatch:
jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libboost-dev libsqlite3-dev python3
      - name: Extract isolated course test fixture
        run: unzip -q ci/iso8583-gateway.zip
      - name: Configure
        run: cmake -S day05_mock_gateway -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build -j2
      - name: Test gateway and codec
        run: ctest --test-dir build --output-on-failure
