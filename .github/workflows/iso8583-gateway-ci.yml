name: ISO8583 Day 5 codec-only verification
on:
  push:
    branches: [ci-iso8583-gateway-20261119]
  workflow_dispatch:
jobs:
  codec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Day 4 dependencies
        run: sudo timeout 90s env DEBIAN_FRONTEND=noninteractive apt-get install -y libboost-dev libsqlite3-dev
      - name: Extract Day 5 code-only package
        run: unzip -q ci/iso8583-codec-only.zip
      - name: Configure
        run: cmake -S day05_codec_only -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build -j2
      - name: Test
        run: ctest --test-dir build --output-on-failure
