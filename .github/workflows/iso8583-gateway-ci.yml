name: ISO8583 mock gateway verification
on:
  push:
    branches: [ci-iso8583-gateway-20261119]
  workflow_dispatch:
jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install missing C++ headers
        run: |
          test -f /usr/include/sqlite3.h || echo "sqlite3 header missing"
          test -f /usr/include/boost/asio.hpp || echo "Boost Asio header missing"
          sudo timeout 90s env DEBIAN_FRONTEND=noninteractive apt-get install -y libboost-dev libsqlite3-dev
      - name: Extract isolated course test fixture
        run: unzip -q ci/iso8583-gateway.zip
      - name: Configure
        run: cmake -S day05_mock_gateway -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build -j2
      - name: Test gateway and codec
        run: ctest --test-dir build --output-on-failure
