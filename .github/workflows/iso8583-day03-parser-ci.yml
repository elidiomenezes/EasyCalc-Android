name: ISO8583 Gateway Parser Validation

on:
  push:
    paths:
      - 'iso8583/week10/day03/reference/**'
      - '.github/workflows/iso8583-day03-parser-ci.yml'
  workflow_dispatch:

jobs:
  gateway-parser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install C++17 toolchain and Boost
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libboost-dev libboost-system-dev python3
      - name: Configure
        run: cmake -S iso8583/week10/day03/reference -B build/iso8583-day03 -DCMAKE_BUILD_TYPE=Debug
      - name: Build gateway and parser
        run: cmake --build build/iso8583-day03 --parallel 2
      - name: Public parser tests
        run: ctest --test-dir build/iso8583-day03 --output-on-failure
      - name: Hidden parser grading
        run: |
          python3 iso8583/week10/day03/reference/instructor/grading/grade_parser.py \
            iso8583/week10/day03/reference
      - name: Original gateway public TCP tests
        run: |
          python3 iso8583/week10/day02/reference/tests/public/test_gateway.py \
            --gateway-cmd './build/iso8583-day03/gateway {listen} {authorizer}'
      - name: Original gateway hidden TCP tests
        run: |
          python3 iso8583/week10/day02/reference/tests/instructor/test_hidden_gateway.py \
            --gateway-cmd './build/iso8583-day03/gateway {listen} {authorizer}'
      - name: Retrieve ISO8583 course simulator
        run: |
          docker pull ghcr.io/elidiomenezes/iso8583-course:simulator
          container_id="$(docker create ghcr.io/elidiomenezes/iso8583-course:simulator)"
          mkdir -p "$RUNNER_TEMP/iso8583-simulator"
          docker cp "$container_id:/app/." "$RUNNER_TEMP/iso8583-simulator/"
          docker rm "$container_id"
          test -f "$RUNNER_TEMP/iso8583-simulator/server.py"
          test -f "$RUNNER_TEMP/iso8583-simulator/client.py"
      - name: Inspect simulator CLI and transaction fixtures
        run: |
          set +e
          cd "$RUNNER_TEMP/iso8583-simulator"
          python3 client.py --help
          python3 server.py --help
          python3 - <<'PY'
          import pathlib,json
          root=pathlib.Path('.')
          for folder in ['messages','client-rules','rules','specs']:
              print('DIRECTORY',folder, [p.name for p in (root/folder).glob('*')][:100],flush=True)
          for name in ['messages/authorization-approved.json','messages/network-sign-on.json','specs/nibss-v1.16.json']:
              try:
                  j=json.loads(pathlib.Path(name).read_text())
                  print('FILE',name,repr(j)[:11000],flush=True)
              except Exception as exc: print('ERROR',name,exc,flush=True)
          print('CLIENT SOURCE HEAD',pathlib.Path('client.py').read_text()[:17000],flush=True)
          PY
          exit 0
      - name: Inspect real client rule templates
        run: |
          cd "$RUNNER_TEMP/iso8583-simulator"
          python3 - <<'PY'
          import pathlib
          for name in ['client-rules/authorization-approved.json',
                       'client-rules/network-sign-on.json',
                       'client-rules/financial-advice.json',
                       'client-rules/reversal.json',
                       'client-rules/network-no-response.json',
                       'messages/financial-advice.json',
                       'messages/reversal.json',
                       'messages/administrative-request.json']:
              print('TEMPLATE',name, pathlib.Path(name).read_text()[:6500], flush=True)
          PY
      - name: Real simulator integration
        run: |
          python3 -m pip install --break-system-packages pyiso8583
          python3 iso8583/week10/day02/reference/tests/instructor/validate_real_simulator.py \
            --simulator-dir "$RUNNER_TEMP/iso8583-simulator" \
            --gateway-cmd './build/iso8583-day03/gateway {listen} {authorizer}'
      - name: Real client server extended parser validation
        run: |
          python3 iso8583/week10/day03/reference/instructor/tests/validate_extended_with_simulator.py \
            --simulator-dir "$RUNNER_TEMP/iso8583-simulator" \
            --gateway-cmd './build/iso8583-day03/gateway {listen} {authorizer}'
      - name: Upload gateway binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-day03-parser
          path: build/iso8583-day03/gateway
          if-no-files-found: ignore
