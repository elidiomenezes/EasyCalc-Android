name: ISO8583 Day 2 - Reference Gateway

on:
  workflow_dispatch:
  push:
    paths:
      - 'iso8583/week10/day02/reference/**'
      - '.github/workflows/iso8583-day02-gateway.yml'

jobs:
  test-gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: iso8583/week10/day02/reference
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install compiler, CMake and Boost
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libboost-dev libboost-system-dev python3

      - name: Configure C++17 build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Compile reference gateway
        run: cmake --build build --parallel 2

      - name: Original Day 2 public tests P1-P5
        run: python3 tests/public/test_gateway.py --gateway-cmd './build/gateway {listen} {authorizer}'

      - name: Instructor transport tests H1-H7
        run: python3 tests/instructor/test_hidden_gateway.py --gateway-cmd './build/gateway {listen} {authorizer}'

      - name: Retrieve course simulator container
        run: |
          docker pull ghcr.io/elidiomenezes/iso8583-course:simulator
          container_id="$(docker create ghcr.io/elidiomenezes/iso8583-course:simulator)"
          mkdir -p "$RUNNER_TEMP/iso8583-simulator"
          docker cp "$container_id:/app/." "$RUNNER_TEMP/iso8583-simulator/"
          docker rm "$container_id"
          test -f "$RUNNER_TEMP/iso8583-simulator/server.py"
          test -f "$RUNNER_TEMP/iso8583-simulator/client.py"

      - name: Run real simulator integration
        run: |
          python3 -m pip install --break-system-packages pyiso8583
          python3 tests/instructor/validate_real_simulator.py \
            --simulator-dir "$RUNNER_TEMP/iso8583-simulator" \
            --gateway-cmd './build/gateway {listen} {authorizer}'

      - name: Upload executable for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: day02-reference-build
          path: iso8583/week10/day02/reference/build/gateway
          if-no-files-found: ignore
