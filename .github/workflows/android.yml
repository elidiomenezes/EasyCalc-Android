name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test expression engine
        run: |
          mkdir -p build/engine-test
          javac -d build/engine-test app/src/main/java/com/easycalc/android/ExpressionEngine.java tools/EngineTestSuite.java
          java -cp build/engine-test EngineTestSuite
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Name APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/EasyCalc-Android-v0.1.2-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EasyCalc-Android-v0.1.2-debug
          path: app/build/outputs/apk/debug/EasyCalc-Android-v0.1.2-debug.apk
